<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{width:1440px;height:900px;overflow:hidden}
  body{font-family:'Hanken Grotesk',sans-serif;background:#ffffff;color:#2a1245}
  nav{height:80px;display:flex;align-items:center;justify-content:space-between;padding:0 80px;border-bottom:1px solid #eee8f3}
  .brand{font-weight:700;font-size:22px}
  .links{display:flex;gap:32px;font-size:15px;color:#5c4b6b}
  .wa{height:44px;padding:0 22px;border-radius:999px;background:#2a1245;color:#fff;display:flex;align-items:center;font-weight:600}
  .hero{display:grid;grid-template-columns:1fr 1fr;gap:56px;padding:72px 80px 0}
  h1{font-size:68px;line-height:1.04;font-weight:700;letter-spacing:-.03em}
  p{margin-top:24px;font-size:20px;line-height:1.55;color:#5c4b6b;max-width:520px}
  .cta{margin-top:36px;display:flex;gap:14px}
  .b1{height:56px;padding:0 28px;border-radius:999px;background:#d9a441;color:#2a1245;font-weight:600;display:flex;align-items:center}
  .b2{height:56px;padding:0 28px;border-radius:999px;border:1px solid #d9cfe3;display:flex;align-items:center}
  .photo{height:440px;border-radius:28px;background:linear-gradient(135deg,#efe2d0,#d8b78c 60%,#a9764a)}
  .cards{display:grid;grid-template-columns:repeat(3,1fr);gap:24px;padding:48px 80px}
  .card{height:150px;border-radius:20px;background:#f7f3fa;padding:28px;font-weight:600;font-size:22px}
</style>
</head>
<body>
  <nav><div class="brand">Esencia &amp; Grano</div><div class="links"><span>Productos</span><span>Nosotros</span><span>Preguntas</span><span>Contacto</span></div><div class="wa">WhatsApp</div></nav>
  <section class="hero">
    <div><h1>Frutos secos, granos y especias a granel en Ibagué</h1><p>Más de 120 productos frescos en la Plaza de la 21. Pide por WhatsApp y te lo llevamos.</p>
      <div class="cta"><span class="b1">Pide por WhatsApp</span><span class="b2">Ver productos</span></div></div>
    <div class="photo"></div>
  </section>
  <div class="cards"><div class="card">Condimentos</div><div class="card">Granos</div><div class="card">Frutos secos</div></div>
</body>
</html>
